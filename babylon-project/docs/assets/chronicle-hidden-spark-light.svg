<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="">
  <g fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">
    <text x="0" y="20">Іскра</text>
    <text x="0" y="52">Першапачатковай іскрай Babylon стала пераадоленне моўных цяжкасцей</text>
    <text x="0" y="76">у зносінах з беларускай дзяўчынай.</text>
    <text x="0" y="108">Для гарэння патрэбныя гаручае рэчыва, кісларод і тэмпература ўзгарання.</text>
    <text x="0" y="132">Выбух — гэта надзвычай хуткае гарэнне.</text>
    <text x="0" y="156">Іскра дала тое, што запусціла Вялікі выбух.</text>
  </g>
</svg>
