name: Prettier diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/prettier-diagnostic.yml'
      - 'babylon-project/backend/src/translation/pending-translation-worker.ts'
      - 'babylon-project/backend/test/pending-translation-worker.test.ts'

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: babylon-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: babylon-project/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write backend/src/translation/pending-translation-worker.ts backend/test/pending-translation-worker.test.ts
          git diff -- backend/src/translation/pending-translation-worker.ts backend/test/pending-translation-worker.test.ts
