name: Backend validation

# PR #23 final validation retrigger.
on:
  pull_request:
    paths:
      - 'babylon-project/backend/**'
      - 'babylon-project/package.json'
      - 'babylon-project/package-lock.json'
      - 'babylon-project/eslint.config.js'
      - 'babylon-project/vitest.config.ts'
      - '.github/workflows/backend-validation.yml'
  workflow_dispatch:

jobs:
  validate-backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: babylon_test
          POSTGRES_PASSWORD: babylon_test_password
          POSTGRES_DB: babylon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babylon_test -d babylon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://babylon_test:babylon_test_password@127.0.0.1:5432/babylon_test
    defaults:
      run:
        working-directory: babylon-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: babylon-project/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript source check
        run: npm run check
      - name: TypeScript test check
        run: npm run check:test
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Backend build
        run: npm run build
