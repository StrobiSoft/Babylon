services:
  zoolab-monitor:
    build:
      context: .
    container_name: zoolab-monitor
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config/services.json:/app/config/services.json:ro
      - zoolab-monitor-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  zoolab-monitor-data:
